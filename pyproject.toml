[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ruac"
version = "0.1.0"
description = "Robust Uncertainty-Accuracy Correlation for SAM2 (ICML 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hongyou Zhou"},
]
keywords = ["sam2", "uncertainty", "segmentation", "domain-generalization", "adversarial-training"]
dependencies = [
    "torch>=2.0",
    "numpy",
    "hydra-core>=1.3",
    "omegaconf",
    "einops",
]

[project.optional-dependencies]
viz = ["matplotlib", "tensorboard"]
dev = ["ruff", "pytest"]

[project.urls]
Homepage = "https://github.com/HongyouZhou/ruac"
Paper = "https://github.com/HongyouZhou/ruac"

[tool.setuptools.packages.find]
where = ["."]
include = ["ruac*"]

[tool.ruff]
line-length = 196
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["SIM108", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
